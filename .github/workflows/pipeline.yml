name: Pipeline

# Each job runs a script in .github/workflows/scripts, to keep logic out of
# the YAML. Ported from the single-repo pipeline (Guilherme Wind).
#
# Stages:
#   1. Quality: secrets
#   2. App: SwiftLint + unit, integration and UI tests against a real dev
#      server (macOS; optional for now, it does not block the gate)
#   3. Gate: unified status

on:
  push:
    branches: [main, development, "ft/**"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The server and lib branches that match this run: the PR's target, else
  # main for main, else development.
  PEER_REF: ${{ github.base_ref || (github.ref_name == 'main' && 'main') || 'development' }}

jobs:
  # --- STAGE 1: QUALITY ---
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/workflows/scripts/secrets.sh scan

  # --- STAGE 2: APP TESTS (optional, doesn't block) ---
  app-test:
    name: App Tests
    needs: [secrets]
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hoppin-app/server
          ref: ${{ env.PEER_REF }}
          path: server
      - uses: actions/checkout@v4
        with:
          repository: hoppin-app/lib
          ref: ${{ env.PEER_REF }}
          path: lib
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: SwiftLint
        run: .github/workflows/scripts/app.sh lint
      - name: Tests
        run: .github/workflows/scripts/app.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/ci/xcodebuild.log
          if-no-files-found: ignore

  # --- GATE: unified status (quality must pass, app-test optional) ---
  gate:
    name: Pipeline Status
    if: always()
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Pipeline failed"
            exit 1
          fi
          echo "Pipeline passed"
